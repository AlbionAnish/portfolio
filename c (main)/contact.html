<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Albion | Contact me</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
    <nav aria-label="Main">
        <a href="index.html">Portfolio</a>
        <a href="projects.html">Projects</a>
        <a class="btn" href="contact.html" aria-current="page">Contact</a>
    </nav>
</header>

<main class="form-page">
    <div class="form-box">
        <h2>Get In Touch</h2>
        <p>Send me a message!</p>
        <form name="contact" method="POST" action="/success" data-netlify="true" netlify-honeypot="bot-field">
            <input type="hidden" name="form-name" value="contact">
            <p hidden><label>Leave this empty: <input name="bot-field"></label></p>
            <input type="text" name="name" placeholder="Your name" aria-label="Your name" required>
            <input type="email" name="email" placeholder="Your email" aria-label="Your email" required>
            <textarea name="message" placeholder="Your message.." aria-label="Your message" required></textarea>
            <button type="submit">Send Message</button>
        </form>
    </div>
</main>

</body>
</html>
